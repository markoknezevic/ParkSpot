[project]
name = "parkspot-backend"
version = "0.1.0"
description = "ParkSpot FastAPI backend"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.16,<2.0",
    "auth0-fastapi-api>=1.0.0b9",
    "celery[redis]>=5.5,<6.0",
    "fastapi>=0.115,<1.0",
    "fastembed>=0.7,<0.8",
    "httpx>=0.28,<1.0",
    "pgvector>=0.4,<0.5",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.0,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = []
