services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: parkspot
      POSTGRES_USER: parkspot
      POSTGRES_PASSWORD: parkspot
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkspot -d parkspot"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://parkspot:parkspot@db:5432/parkspot
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "uv run alembic upgrade head && uv run uvicorn app.core.main:app --host 0.0.0.0 --port 8000"]

volumes:
  postgres_data:
