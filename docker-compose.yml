services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: parkspot
      POSTGRES_USER: parkspot
      POSTGRES_PASSWORD: parkspot
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkspot -d parkspot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://parkspot:parkspot@db:5432/parkspot
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "uv run alembic upgrade head && uv run uvicorn app.core.main:app --host 0.0.0.0 --port 8000"]

  worker:
    build:
      context: ./backend
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command: ["uv", "run", "celery", "-A", "app.jobs.celery_app:celery_app", "worker", "--loglevel=INFO", "--queues=jobs"]

volumes:
  postgres_data:
